<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blog Details - MyBlog</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h2>MyBlog</h2>

    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
        <a href="dashboard.html">Dashboard</a>
    </nav>
</header>

<main class="container">

    <h2>Blog Details</h2>

    <div id="blogDetails" class="blog-card">
        Loading blog...
    </div>

    <br>

    <a href="index.html" class="btn">Back to Home</a>

</main>

<footer>
    <p>&copy; 2026 MyBlog. All rights reserved.</p>
</footer>

<script>
const API = "http://localhost:3000/api";

async function loadBlogDetails() {

    const container = document.getElementById("blogDetails");

    const params = new URLSearchParams(window.location.search);

    const blogId = params.get("id");

    if (!blogId) {
        container.textContent = "Blog ID not found";
        return;
    }

    try {

        const response = await fetch(`${API}/blogs/${encodeURIComponent(blogId)}`);

        const blog = await response.json();

        if (!response.ok) {
            throw new Error(blog.message || "Blog not found");
        }

        container.replaceChildren();

        const title = document.createElement("h2");
        title.textContent = blog.title;

        const content = document.createElement("p");
        content.textContent = blog.content;

        const author = document.createElement("p");
        author.textContent = "Author: " +
            (blog.author?.name || "Unknown");

        const date = document.createElement("p");
        date.textContent = "Published: " +
            new Date(blog.createdAt).toLocaleDateString();

        container.append(title, content, author, date);

    } catch (error) {

        container.textContent = error.message;

    }
}

loadBlogDetails();
</script>

</body>
</html>
